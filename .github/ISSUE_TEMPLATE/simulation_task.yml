name: 🔧 Simulation Task
description: Create a task for model training, testing, or benchmarking
title: "[Simulation] "
labels: ["simulation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🔧 Simulation Task
        Use this template for tasks related to model training, testing, dataset preparation, or benchmarking.
  
  - type: input
    id: task-title
    attributes:
      label: Task Summary
      description: Brief description of the simulation task
      placeholder: e.g., Train YOLOv5 on RTTS foggy dataset
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: Task Type
      description: What type of simulation task is this?
      options:
        - Model Training
        - Dataset Preparation
        - Benchmarking
        - Model Evaluation
        - Accuracy Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: Provide a detailed description of the task
      placeholder: |
        What needs to be done?
        What model/dataset is involved?
        What are the expected outcomes?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What defines this task as complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Task priority level
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Project Phase
      description: Which phase does this task belong to?
      options:
        - Phase 1 - Literature Review
        - Phase 2 - Implementation
        - Phase 3 - Deployment
        - Phase 4 - Documentation
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources/References
      description: Any relevant papers, datasets, or links
      placeholder: |
        - Dataset: RTTS
        - Paper: [link]
        - Model: YOLOv5s
    validations:
      required: false

  - type: input
    id: estimated-time
    attributes:
      label: Estimated Time
      description: How long do you estimate this task will take?
      placeholder: e.g., 2 days, 1 week
    validations:
      required: false
